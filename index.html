<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>授業用くじ引きアプリ</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      text-align: center;
      background: #f0f4f8;
      margin: 0;
      padding: 15px;
      user-select: none;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    h1 {
      color: #333;
      font-size: 1.4rem;
      margin-top: 0;
      margin-bottom: 15px;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 15px;
    }
    select, button {
      padding: 8px 12px;
      font-size: 0.95rem;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #fff;
      cursor: pointer;
    }
    .btn-edit {
      background: #f1f5f9;
      color: #475569;
      font-weight: bold;
    }
    .display-area {
      height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      border-radius: 12px;
      margin: 15px 0 10px 0;
      border: 2px dashed #cbd5e1;
      overflow: hidden;
    }
    .name-display {
      font-size: 2.8rem;
      font-weight: bold;
      color: #1e293b;
    }
    .status-bar {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
    }
    .btn-draw {
      background: #3b82f6;
      color: white;
      border: none;
      font-size: 1.3rem;
      padding: 12px 36px;
      font-weight: bold;
      border-radius: 30px;
      box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
      cursor: pointer;
    }
    .btn-draw:active {
      transform: scale(0.96);
    }
    .btn-draw:disabled {
      background: #94a3b8;
      box-shadow: none;
    }
    .btn-reset-small {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
    }
    /* 当たった生徒一覧エリア */
    .history-container {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #e2e8f0;
      text-align: left;
    }
    .history-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: #475569;
      margin-bottom: 10px;
    }
    .history-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 150px;
      overflow-y: auto;
    }
    .history-tag {
      background: #e2e8f0;
      color: #334155;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .history-tag span {
      font-size: 0.75rem;
      color: #64748b;
    }
    /* モーダル画面（最前面に表示） */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 12px;
      width: 85%;
      max-width: 400px;
      text-align: left;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    textarea {
      width: 100%;
      height: 180px;
      margin: 10px 0;
      font-size: 1rem;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎯 授業用くじ引き</h1>

    <div class="controls">
      <!-- クラス選択 -->
      <select id="classSelect" onchange="changeClass()">
        <option value="1">1組</option>
        <option value="2">2組</option>
        <option value="3">3組</option>
        <option value="4">4組</option>
        <option value="5">5組</option>
        <option value="6">6組</option>
        <option value="7">7組</option>
        <option value="8">8組</option>
      </select>

      <!-- 演出時間の選択 -->
      <select id="speedSelect" onchange="saveSpeed()">
        <option value="500">⚡ サクサク (0.5秒)</option>
        <option value="1000" selected>⚖️ ふつう (1秒)</option>
        <option value="3000">🎭 じっくり (3秒)</option>
      </select>

      <!-- 名簿編集ボタン -->
      <button class="btn-edit" onclick="openModal()">📝 名簿の編集</button>
    </div>

    <!-- 名前表示エリア -->
    <div class="display-area">
      <div id="nameDisplay" class="name-display">スタート！</div>
    </div>

    <!-- ステータス（残り人数など） -->
    <div class="status-bar">
      <span id="statusText">残り: 0人 / 全員: 0人</span>
      <button class="btn-reset-small" onclick="resetLottery()">🔄 最初からやり直す</button>
    </div>

    <!-- くじを引くボタン -->
    <button id="drawBtn" class="btn-draw" onclick="startLottery()">くじを引く</button>

    <!-- 当たった生徒一覧 -->
    <div class="history-container">
      <div class="history-title">🎉 当たった生徒 (<span id="historyCount">0</span>名)</div>
      <div id="historyList" class="history-list"></div>
    </div>
  </div>

  <!-- 名簿編集用モーダル -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <h3 style="margin-top:0;">📝 <span id="modalClassTitle">1組</span> の名簿編集</h3>
      <p style="font-size: 0.85rem; color: #666; margin: 0;">1行に1名ずつ名前を入力してください（最大35名）</p>
      <textarea id="rosterInput"></textarea>
      <div class="modal-buttons">
        <button onclick="closeModal()">キャンセル</button>
        <button style="background:#3b82f6; color:white; border:none; padding:8px 16px; border-radius:6px;" onclick="saveRoster()">保存する</button>
      </div>
    </div>
  </div>

  <script>
    let currentClass = "1";
    let rosters = {};
    let remainingStudents = [];
    let drawnStudents = [];
    let isSpinning = false;

    // 初期化
    window.onload = function() {
      loadRosters();
      loadSpeed();
      resetLottery();
    };

    // 演出スピードのロード・保存
    function loadSpeed() {
      try {
        const savedSpeed = localStorage.getItem('lottery_speed');
        if (savedSpeed) {
          document.getElementById('speedSelect').value = savedSpeed;
        }
      } catch(e) {}
    }

    function saveSpeed() {
      try {
        const speed = document.getElementById('speedSelect').value;
        localStorage.setItem('lottery_speed', speed);
      } catch(e) {}
    }

    // 名簿データのロードと安全化
    function loadRosters() {
      rosters = {};
      try {
        const saved = localStorage.getItem('lottery_rosters');
        if (saved) {
          rosters = JSON.parse(saved);
        }
      } catch (e) {
        rosters = {};
      }

      if (!rosters || typeof rosters !== 'object') {
        rosters = {};
      }

      // 各クラス（1〜8）のデータを配列として確実に初期化
      for (let i = 1; i <= 8; i++) {
        const key = String(i);
        if (!Array.isArray(rosters[key])) {
          if (typeof rosters[key] === 'string') {
            rosters[key] = rosters[key].split('\n').map(s => s.trim()).filter(s => s !== '');
          } else {
            rosters[key] = Array.from({length: 35}, (_, k) => `生徒${k + 1}`);
          }
        }
      }
    }

    // クラス切り替え
    function changeClass() {
      currentClass = document.getElementById('classSelect').value;
      resetLottery();
    }

    // くじのリセット（最初からやり直す）
    function resetLottery() {
      const key = String(currentClass);
      const currentList = Array.isArray(rosters[key]) ? rosters[key] : [];
      remainingStudents = [...currentList];
      drawnStudents = [];
      document.getElementById('nameDisplay').textContent = "スタート！";
      updateUI();
    }

    // UI更新（カウント・当たった人リスト）
    function updateUI() {
      const key = String(currentClass);
      const currentList = Array.isArray(rosters[key]) ? rosters[key] : [];
      const total = currentList.length;
      const remaining = remainingStudents.length;
      
      document.getElementById('statusText').textContent = `残り: ${remaining}人 / 全員: ${total}人`;
      document.getElementById('historyCount').textContent = drawnStudents.length;

      const historyListEl = document.getElementById('historyList');
      if (historyListEl) {
        historyListEl.innerHTML = '';
        drawnStudents.forEach((student, index)
