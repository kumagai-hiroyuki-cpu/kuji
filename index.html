<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>授業用くじ引きアプリ</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      text-align: center;
      background: #f0f4f8;
      margin: 0;
      padding: 15px;
      user-select: none;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    h1 {
      color: #333;
      font-size: 1.4rem;
      margin-top: 0;
      margin-bottom: 15px;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 15px;
    }
    select, button {
      padding: 8px 12px;
      font-size: 0.95rem;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #fff;
      cursor: pointer;
    }
    .btn-edit {
      background: #f1f5f9;
      color: #475569;
      font-weight: bold;
    }

    /* 画面内編集パネル（ポップアップを使わない安全設計） */
    .edit-panel {
      display: none;
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      padding: 15px;
      margin: 15px 0;
      text-align: left;
    }
    textarea {
      width: 100%;
      height: 160px;
      margin: 10px 0;
      font-size: 1rem;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    .edit-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .display-area {
      height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      border-radius: 12px;
      margin: 15px 0 10px 0;
      border: 2px dashed #cbd5e1;
      overflow: hidden;
    }
    .name-display {
      font-size: 2.8rem;
      font-weight: bold;
      color: #1e293b;
    }
    .status-bar {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
    }
    .btn-draw {
      background: #3b82f6;
      color: white;
      border: none;
      font-size: 1.3rem;
      padding: 12px 36px;
      font-weight: bold;
      border-radius: 30px;
      box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
      cursor: pointer;
    }
    .btn-draw:active {
      transform: scale(0.96);
    }
    .btn-draw:disabled {
      background: #94a3b8;
      box-shadow: none;
    }
    .btn-reset-small {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
    }
    .history-container {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #e2e8f0;
      text-align: left;
    }
    .history-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: #475569;
      margin-bottom: 10px;
    }
    .history-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 150px;
      overflow-y: auto;
    }
    .history-tag {
      background: #e2e8f0;
      color: #334155;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .history-tag span {
      font-size: 0.75rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎯 授業用くじ引き</h1>

    <div class="controls">
      <!-- クラス選択 -->
      <select id="classSelect" onchange="changeClass()">
        <option value="1">1組</option>
        <option value="2">2組</option>
        <option value="3">3組</option>
        <option value="4">4組</option>
        <option value="5">5組</option>
        <option value="6">6組</option>
        <option value="7">7組</option>
        <option value="8">8組</option>
      </select>

      <!-- 演出時間 -->
      <select id="speedSelect" onchange="saveSpeed()">
        <option value="500">⚡ サクサク (0.5秒)</option>
        <option value="1000" selected>⚖️ ふつう (1秒)</option>
        <option value="3000">🎭 じっくり (3秒)</option>
      </select>

      <!-- 名簿編集ボタン -->
      <button class="btn-edit" onclick="toggleEditPanel()">📝 名簿の編集</button>
    </div>

    <!-- 画面内に展開する名簿編集パネル -->
    <div id="editPanel" class="edit-panel">
      <h3 style="margin-top:0;">📝 <span id="panelClassTitle">1組</span> の名簿編集</h3>
      <p style="font-size: 0.85rem; color: #666; margin: 0;">1行に1名ずつ名前を入力してください（最大35名）</p>
      <textarea id="rosterInput"></textarea>
      <div class="edit-buttons">
        <button onclick="toggleEditPanel()">閉じる</button>
        <button style="background:#3b82f6; color:white; border:none; padding:8px 16px; border-radius:6px;" onclick="saveRoster()">保存する</button>
      </div>
    </div>

    <!-- 名前表示エリア -->
    <div class="display-area">
      <div id="nameDisplay" class="name-display">スタート！</div>
    </div>

    <!-- ステータス -->
    <div class="status-bar">
      <span id="statusText">残り: 0人 / 全員: 0人</span>
      <button class="btn-reset-small" onclick="resetLottery()">🔄 最初からやり直す</button>
    </div>

    <!-- くじを引くボタン -->
    <button id="drawBtn" class="btn-draw" onclick="startLottery()">くじを引く</button>

    <!-- 当たった生徒一覧 -->
    <div class="history-container">
      <div class="history-title">🎉 当たった生徒 (<span id="historyCount">0</span>名)</div>
      <div id="historyList" class="history-list"></div>
    </div>
  </div>

  <script>
    let currentClass = "1";
    let rosters = {};
    let remainingStudents = [];
    let drawnStudents = [];
    let isSpinning = false;

    window.onload = function() {
      loadRosters();
      loadSpeed();
      resetLottery();
    };

    function loadSpeed() {
      try {
        const savedSpeed = localStorage.getItem('lottery_speed');
        if (savedSpeed) document.getElementById('speedSelect').value = savedSpeed;
      } catch(e) {}
    }

    function saveSpeed() {
      try {
        localStorage.setItem('lottery_speed', document.getElementById('speedSelect').value);
      } catch(e) {}
    }

    function loadRosters() {
      rosters = {};
      try {
        const saved = localStorage.getItem('lottery_rosters');
        if (saved) rosters = JSON.parse(saved);
      } catch (e) {
        rosters = {};
      }

      for (let i = 1; i <= 8; i++) {
        const key = String(i);
        if (!Array.isArray(rosters[key])) {
          rosters[key] = Array.from({length: 35}, (_, k) => `生徒${k + 1}`);
        }
      }
    }

    function changeClass() {
      currentClass = document.getElementById('classSelect').value;
      // 編集パネルが開いていたら表示を切り替え
      if (document.getElementById('editPanel').style.display === 'block') {
        openEditPanel();
      }
      resetLottery();
    }

    function resetLottery() {
      const key = String(currentClass);
      const currentList = Array.isArray(rosters[key]) ? rosters[key] : [];
      remainingStudents = [...currentList];
      drawnStudents = [];
      document.getElementById('nameDisplay').textContent = "スタート！";
      updateUI();
    }

    function updateUI() {
      const key = String(currentClass);
      const currentList = Array.isArray(rosters[key]) ? rosters[key] : [];
      document.getElementById('statusText').textContent = `残り: ${remainingStudents.length}人 / 全員: ${currentList.length}人`;
      document.getElementById('historyCount').textContent = drawnStudents.length;

      const historyListEl = document.getElementById('historyList');
      if (historyListEl) {
        historyListEl.innerHTML = '';
        drawnStudents.forEach((student, index) => {
          const tag = document.createElement('div');
          tag.className = 'history-tag';
          tag.innerHTML = `<span>${index + 1}.</span> ${student}`;
          historyListEl.appendChild(tag);
        });
      }
    }

    function startLottery() {
      if (isSpinning) return;
      const key = String(currentClass);
      const currentList = Array.isArray(rosters[key]) ? rosters[key] : [];

      if (currentList.length === 0) {
        alert('名簿が空です。「名簿の編集」から名前を追加してください。');
        return;
      }
      
      if (remainingStudents.length === 0) resetLottery();

      const display = document.getElementById('nameDisplay');
      const drawBtn = document.getElementById('drawBtn');
      const duration = parseInt(document.getElementById('speedSelect').value, 10);
      
      isSpinning = true;
      drawBtn.disabled = true;

      const timer = setInterval(() => {
        const randomName = currentList[Math.floor(Math.random() * currentList.length)];
        display.textContent = randomName;
      }, 40);

      setTimeout(() => {
        clearInterval(timer);
        const selectedIndex = Math.floor(Math.random() * remainingStudents.length);
        const winner = remainingStudents.splice(selectedIndex, 1)[0];
        
        drawnStudents.push(winner);
        display.textContent = winner;
        updateUI();
        
        isSpinning = false;
        drawBtn.disabled = false;
      }, duration);
    }

    // 編集パネルのトグル表示
    function toggleEditPanel() {
      const panel = document.getElementById('editPanel');
      if (panel.style.display === 'block') {
        panel.style.display = 'none';
      } else {
        openEditPanel();
      }
    }

    function openEditPanel() {
      const key = String(currentClass);
      document.getElementById('panelClassTitle').textContent = `${key}組`;
      const currentList = rosters[key] || [];
      document.getElementById('rosterInput').value = currentList.join('\n');
      document.getElementById('editPanel').style.display = 'block';
    }

    function saveRoster() {
      const key = String(currentClass);
      const text = document.getElementById('rosterInput').value;
      const lines = text.split('\n').map(s => s.trim()).filter(s => s !== '');
      
      rosters[key] = lines;
      try {
        localStorage.setItem('lottery_rosters', JSON.stringify(rosters));
      } catch(e) {}
      
      resetLottery();
      document.getElementById('editPanel').style.display = 'none';
    }
  </script>
</body>
</html>
